name: Tests

on:
  push:
  pull_request:

# El token del workflow solo puede leer el repo: acá no se publica ni se modifica nada.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Fijadas por SHA, no por tag: un tag se puede mover a otro código.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Sin dependencias que instalar: los tests usan solo node:test
      - run: npm test
